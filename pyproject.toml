[project]
name = "knowledge-cartography"
version = "0.1.0"
description = "Build an interactive 2D map of your personal knowledge graph from social media exports and browsing history."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "chromadb>=0.5",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "numpy>=1.26",
    "numba>=0.59",
    "llvmlite>=0.42",
    "plotly>=5.20",
    "trafilatura>=1.8",
    "requests>=2.31",
    "anthropic>=0.34",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
local = ["ollama>=0.3"]
vertex = ["google-cloud-aiplatform>=1.60"]

[project.scripts]
cartography = "cartography.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartography"]
